[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwatt"
version = "0.1.0a0"
description = "Embedded energy observability and regression testing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
  { name = "Vinícius Eduardo Alves Pedrosa", email = "vinicius.eduardo.pedrosa@gmail.com" }
]
keywords = [
  "embedded",
  "energy",
  "power",
  "profiling",
  "zephyr",
  "hardware-in-the-loop"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware"
]
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "ruff>=0.4",
  "types-PyYAML>=6.0"
]
joulescope = []
ppk2 = []

[project.scripts]
uwatt = "uwatt.cli.main:main"

[project.urls]
Homepage = "https://github.com/uwatt/uwatt"
Documentation = "https://github.com/uwatt/uwatt/tree/main/docs"
Issues = "https://github.com/uwatt/uwatt/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["uwatt"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true

