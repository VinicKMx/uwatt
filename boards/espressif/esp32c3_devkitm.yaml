board: esp32c3_devkitm/esp32c3
vendor: espressif
mcu: ESP32-C3
platform: zephyr

marker:
  gpio: GPIO10

measurement:
  recommended_voltage: 3.3V
  safe_voltage_min: 3.0V
  safe_voltage_max: 3.6V

flashing:
